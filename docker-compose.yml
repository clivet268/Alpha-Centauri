# Local Postgres for backend development. schema.sql runs on first start (empty volume).
# Reset: npm run db:down -- -v && npm run db:up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: raser
      POSTGRES_PASSWORD: raser
      POSTGRES_DB: raser
    ports:
      - '5432:5432'
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
