<html>
  <head>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="authcontainerbase">
      <div class="">
        <div class="title-bar">Reviewer Access</div>
      </div>
      <div class="authspace">
        <div class="auth">
          <div style="width: 400px; height: 300px; background-color: #d1d1f0; margin: 10px; align-content: center; justify-content: center; font-size: 24px;">
            <form method="get" action="reviewer_review.html">
              <div style="display:flex; flex-direction: column; justify-content: center; align-items: center; font-size: 24px;">
                <label for="rubricUrl">Access Rubric</label>
                <div>
                  <input type="text" id="rubricUrl" placeholder="Enter RubricURL" required>
                </div>
                <div>
                  <input type="text" id="pin" placeholder="Enter PIN" inputmode="numeric" required>
                </div>
                <div class="actions">
                  <button type="submit" class="submit-btn">Open Review</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
